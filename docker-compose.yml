name: okfolio

x-runtime: &runtime
  image: ${OKFOLIO_IMAGE:-okfolio:0.1.1}
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
    target: service
  environment: &runtime-environment
    DATA_DIR: /app/runtime/data
    SOURCES_DIR: /app/runtime/data/normalized-sources
    PROMPTS_DIR: /app/prompts
    RELEASES_DIR: /app/runtime/releases
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-900}
    OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-2}
    OPENAI_ENABLE_THINKING: ${OPENAI_ENABLE_THINKING:-false}
    OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-32768}
    OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_object}
    MCP_ENABLE_WRITES: ${MCP_ENABLE_WRITES:-false}
    DATA_ASSET_MODE: ${DATA_ASSET_MODE:-local}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_WRITER_FACTORY: ${S3_WRITER_FACTORY:-}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_PREFIX: ${S3_PREFIX:-okfolio}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_VERIFY_TLS: ${S3_VERIFY_TLS:-true}
    S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    MINERU_PROVIDER: ${MINERU_PROVIDER:-openai-compatible}
    MINERU_BASE_URL: ${MINERU_BASE_URL:-}
    MINERU_API_KEY: ${MINERU_API_KEY:-}
    MINERU_MODEL: ${MINERU_MODEL:-}
    MINERU_TIMEOUT: ${MINERU_TIMEOUT:-180}
    MINERU_MAX_CONCURRENCY: ${MINERU_MAX_CONCURRENCY:-8}
    PAGE_ROLE_CLASSIFIER: ${PAGE_ROLE_CLASSIFIER:-off}
    PAGE_ROLE_BASE_URL: ${PAGE_ROLE_BASE_URL:-}
    PAGE_ROLE_API_KEY: ${PAGE_ROLE_API_KEY:-}
    PAGE_ROLE_MODEL: ${PAGE_ROLE_MODEL:-}
    PAGE_RECOVERY_BASE_URL: ${PAGE_RECOVERY_BASE_URL:-}
    PAGE_RECOVERY_API_KEY: ${PAGE_RECOVERY_API_KEY:-}
    PAGE_RECOVERY_MODEL: ${PAGE_RECOVERY_MODEL:-}
  volumes:
    - ./runtime/data:/app/runtime/data
    - ./runtime/releases:/app/runtime/releases

services:
  mcp:
    <<: *runtime
    restart: unless-stopped
    ports:
      - "${OKFOLIO_MCP_PORT:-3099}:3099"

  pdf-corpus:
    <<: *runtime
    profiles: ["pdf"]
    restart: "no"
    entrypoint: ["python3", "/app/scripts/process_pdf_corpus.py"]

  agentwiki:
    <<: *runtime
    profiles: ["agent"]
    restart: "no"
    entrypoint: ["python3", "/app/scripts/agent_compile.py"]

  compiler:
    <<: *runtime
    profiles: ["classic"]
    restart: "no"
    entrypoint: ["bash", "/app/scripts/process_inbox.sh"]
