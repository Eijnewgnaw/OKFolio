0d477146b818", "title": "成都深化区域合作的生态环境保护治理合力", "type": "政策建议", "kind": "proposition", "description": "成都通过推动环境污染联防联治、强化绿色低碳合作发展及搭建环境治理智慧平台，加快凝聚生态环境保护治理合力。", "body": "## 环境污染联防联治机制\n\n成都积极参与川渝两地重污染天气应急预案修订，推动实施重污染天气应急预案启动统一分级标准，并加快推进国家环境保护机动车污染控制与模拟重点实验室（成都基地）项目建设。通过协同推动川渝地区机动车检验及交通污染数据信息共享，加强区域大气污染协同治理。\n\n在水环境方面，以水源保护、水污染防治、水环境治理、水生态修复为重点，联动沱江岷江流域沿线城市完善跨区域水体监测网络和预警应急体系，实现流域监测信息共享。同时，积极与周边城市共同开展饮用水源地水生态监测及评估体系研究，推动建立成都、资阳老鹰水库生态补偿机制。\n\n- 加快落实成渝地区《危险废物跨省转移“白名单”合作机制》，有效简化危险废物跨省市转移审批程序。\n- 探索创新生态保护“跨市联动”“市县联动”“交叉执法”“测管协同”模式，适时开展跨区域联合执法，共同筑牢长江上游生态屏障。\n\n## 绿色低碳合作发展路径\n\n联动成渝地区相关城市强化减污降碳协同增效政策、路径协同研究，协同开展园区、企业、社区等近零碳排放区建设。\n\n共同打造成渝电走廊、氢走廊等产业合作示范，加快培育具有国际竞争力的绿色低碳产业集群，推动区域绿色低碳合作发展。\n\n## 环境治理智慧平台建设\n\n联动周边城市共同开展“智慧生态”建设，推广智慧大气、智慧水环境、智慧医废等系统平台，共享院士（专家）等环境领域智库。\n\n健全大气和水质水量自动监测站的天空地一体环境监测体系，推动实现污染源清单、重点源监管、监测网络等数据共享。\n\n强化与国家环境监测总站合作，联合争取生态环境监测西南创新中心（成都基地）建设项目落地，逐步建成具有全国影响力的生态环境监测科技创新中心。\n\n## 关联概念\n\n- [成都深化区域合作的体制机制改革与总体框架](../concepts/proposition-28120de9b045.md) — ref-5803c244c3da 提出凝聚生态环境保护治理合力的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘生态共建共保’领域。前者是后者中生态共建部分的具体政策建议，二者存在建议与框架的实质关联。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-5803c244c3da` — 综合篇 › 五、成都未来深化区域合作的建议 › （四）加快凝聚生态环境保护治理合力 · 第 34–35 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-5803c244c3da"]}, {"id": "proposition-28120de9b045", "title": "成都深化区域合作的体制机制改革与总体框架", "type": "政策建议", "kind": "proposition", "description": "综合阐述成都深化区域合作的总体建议框架，并重点聚焦于创新区域协同发展体制机制改革，包括争取省级统筹、建立利益联结机制及推动政策跨区域供给。", "body": "## 总体目标与核心领域\n\n深入贯彻落实对四川和成都工作系列讲话和重要指示精神，坚持服务国家发展大局，围绕产业协同、创新协同、基础设施共建、生态共建共保、公共服务共享、体制机制构建等重点合作领域，加快打破地区分割和行政壁垒，推动更多重大平台、重大项目等落地落实，为全国区域协调发展大局贡献成都力量。\n\n核心在于创新区域协同发展体制机制改革，通过强化省级统筹、共建利益联结机制及协同推动政策跨区域供给，解决区域合作中的深层次问题，实现从行政分割向经济协同的转变。\n\n## 创新区域协同发展体制机制改革\n\n一是争取省级统筹强化区域协同发展力度。主动联合省内五大经济区相关城市共同争取在省级层面制定出台“推动区域联动发展、助力成渝地区双城经济圈建设的差异化指导意见”，结合“四个发力”主攻方向，明确区域联动合作方向、合作领域、重点保障要素等，并制定完善考核办法，力争在产业发展、创新开放、金融服务、文化旅游等领域的合作发展中实现深层次突破。\n\n二是探索共建利益联结机制。按照“统计分算”原则，加快与合作地区制定跨区域合作项目的产值统计政策，建议对合作项目所产生的经济考核指标，由属地政府统计部门按现行统计制度进行统计、核算和发布；实施经济指标考核时，与合作地区综合考虑权责关系和投入比例等因素共同分享经济考核指标。加快制定跨区域项目财税利益分享实施细则，重点针对企业迁建、总部迁移等存量跨区域合作项目实行基数返还、增量分成的经济利益共享模式；对园区共建、项目合作等跨区域协同招商项目在项目主动流转地和项目受让地之间通过一事一议确定经济利益分享比例。\n\n三是协同推动政策跨区域供给。主动联合成渝地区双城经济圈及国内重点合作城市，找准产业协作配套、创新资源共用与成果转化、开放平台共建共享、要素政策协同支持等领域迫切需要解决的问题，共同出台支持重点合作领域建设发展的政策措施。如针对成都都市圈重大对外开放平台辐射作用发挥不足的问题，成都应与德眉资共同出台相关政策和资金支持，助力都市圈企业无差别享受平台优惠服务。\n\n## 优化完善区域协作体制机制\n\n建立健全区域合作工作机制。完善交界地带区域规划政策机制，协同德眉资等强化产业、公服、文旅、生态等领域规划有机衔接，探索构建协同编制、联合报批、共同实施的规划管理制度。联合重庆共同双核联动联建“三级”机制高效运行，进一步明确工作专班及协调组工作职能、优化工作流程，共同增强对联动联建会议的支撑服务，凝聚联动联建“三级”工作合力。\n\n优化跨区域合作项目协调推进机制。按照“清单制+责任制”管理合作事项，明确责任主体、工作计划。围绕区域合作过程中出现的问题或困难事项，探索召集专题协调会议，推动协调解决问题。严格落实重大事项请示报告、重要协议审核决策、重点任务推进执行等工作制度，加强重大问题协商协调和宣传统筹氛围营造，闭环式推动合作任务落地。\n\n建立健全市场主体参与区域合作机制。充分发挥市场化机制作用，制定发布市场主体参与区域合作清单，全面调动市场主体、社会力量等参与区域合作，提升区域合作内生动力，着力构建“企业为主体、市场为导向、政府为引导”的多元区域合作体制机制。\n\n探索构建长效合作的利益链接机制。探索制定跨区域财政协同投入办法，以共同出资、互相持股、成立跨区域专项资金等合作模式，建立跨区域产业合作、重大基础设施共建、科技创新联合攻关等合作项目的财政协同投入机制。出台推动跨区域合作支持政策以及跨行政区利益分享的实施细则文件，加快研究制定跨行政区税收解缴及利益结算办法。加快设计跨区域经济指标统计分算机制，保障行政区与经济区适度分离改革常态化、长期化。\n\n## 关联概念\n\n- [成都深化区域合作的产业跨区集聚成链发展](../concepts/proposition-8f8b98a61143.md) — ref-d6ccc11f85e0 提出推动产业跨区集聚成链发展的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘产业协同’领域。前者是后者中产业协同部分的具体政策建议，二者存在建议与框架的实质关联。\n- [成都深化区域合作的优质公共服务跨区延伸共享](../concepts/proposition-7050d4051104.md) — ref-fb0b1430d65a 提出推动优质公共服务跨区延伸共享的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘公共服务共享’领域。前者是后者中公共服务共享部分的具体政策建议，二者存在建议与框架的实质关联。\n- [成都深化区域合作的基础设施互联互通水平提升](../concepts/proposition-f103da0535eb.md) — ref-ea018f9a8d09 提出提升基础设施互联互通水平的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘基础设施共建’领域。前者是后者中基础设施共建部分的具体政策建议，二者存在建议与框架的实质关联。\n- [成都深化区域合作的生态环境保护治理合力](../concepts/proposition-0d477146b818.md) — ref-5803c244c3da 提出凝聚生态环境保护治理合力的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘生态共建共保’领域。前者是后者中生态共建部分的具体政策建议，二者存在建议与框架的实质关联。\n- [成都深化区域合作的科技协同创新网络构建](../concepts/proposition-d34e62693a0c.md) — ref-3f94a4b993eb 提出构建科技协同创新网络的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘创新协同’领域。前者是后者中创新协同部分的具体政策建议，二者存在建议与框架的实质关联。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n- [Article：cc74e3e3-a764-4bab-b326-3b64fe6ad5eb](../articles/article-e25747f62171.md)\n\n## ConceptRef\n\n- `ref-2b3448db9db2` — 综合篇 › 五、成都未来深化区域合作的建议 › （六）创新区域协同发展体制机制改革 · 第 36 页\n- `ref-ca45f9f7d618` — 综合篇 › 四、继续深化成都区域合作的几点建议 · 第 36–40 页", "articles": ["article-60b51caef447", "article-e25747f62171"], "ref_ids": ["ref-2b3448db9db2", "ref-ca45f9f7d618"]}, {"id": "proposition-7050d4051104", "title": "成都深化区域合作的优质公共服务跨区延伸共享", "type": "政策建议", "kind": "proposition", "description": "成都通过深化教育、医疗、养老、文体、就业及政务服务六大领域的跨区域合作，推动优质公共服务资源共建共享与协同发展。", "body": "## 核心判断\n\n成都致力于推动优质公共服务跨区延伸共享，旨在通过深化教育、医疗、养老、文体、就业及政务服务等领域的区域合作，实现资源的高效整合与协同发展。\n\n该策略强调与北京、上海、重庆、德阳、眉山、资阳及长三角、粤港澳等先发地区的多层次联动，通过引进顶尖资源、建立联合机制和共享服务平台，提升区域公共服务的整体品质与覆盖范围。\n\n## 具体实施路径\n\n在教育领域，持续加强与北京、上海合作引进世界顶尖高校和科研机构，支持职业院校与国内院校合作，并与重庆、德阳、眉山、资阳联合共建实训基地，加快建设跨区域职业教育“产教融合共同体”，依托“四川云教”实现教育资源共建共享。\n\n在医疗与养老领域，加强与陇南、贵阳、广州及长三角、粤港澳等地合作，推进检查检验结果互认扩容，建立公共卫生突发应急联动协作机制，并引入优质养老机构及技术，通过服务购买、人才培养等方式整合养老服务资源。\n\n在文体、就业与政务服务领域，搭建成德眉资全域公共图书馆通借通还服务平台，联合举办体育赛事与交叉培训行动；创建区域人力资源信息共享与招聘联动机制，共同搭建高校毕业生就业创业服务平台；深化社保公共服务互联互通，推进社会保障卡通办无差别受理及经办标准、服务流程的完善。\n\n- 深化教育领域交流合作，引进顶尖高校与科研机构，建设跨区域职业教育“产教融合共同体”。\n- 提升医疗合作质效，推进检查检验结果互认，建立公共卫生突发应急联动协作机制。\n- 强化养老服务合作联动，引入先发地区优质资源，开展多方位协作整合资源。\n- 推动文体资源共建共享，实施图书馆通借通还及体育联合培训与赛事活动。\n- 协力提升就业服务品质，创建人力资源信息共享与招聘联动机制，对接人才跨区域就业创业。\n- 推动政务服务协同发展，深化社保公共服务互联互通，完善企业职工养老、工伤和失业保险制度。\n\n## 关联概念\n\n- [成都深化区域合作的体制机制改革与总体框架](../concepts/proposition-28120de9b045.md) — ref-fb0b1430d65a 提出推动优质公共服务跨区延伸共享的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘公共服务共享’领域。前者是后者中公共服务共享部分的具体政策建议，二者存在建议与框架的实质关联。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-fb0b1430d65a` — 综合篇 › 五、成都未来深化区域合作的建议 › （五）推动优质公共服务跨区延伸共享 · 第 35–36 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-fb0b1430d65a"]}, {"id": "proposition-8f8b98a61143", "title": "成都深化区域合作的产业跨区集聚成链发展", "type": "政策建议", "kind": "proposition", "description": "成都通过推动产业跨区域协作配套、引优育强链主企业及推动产业跨区域转移承接，构建一体化生产与服务网络，带动全省产业发展同步跃升。", "body": "## 推动产业跨区域协作配套\n\n聚焦智能终端、工业无人机、新能源汽车等重点产业链，定期发布企业主导产品和产能规模图谱，分行业发布产业协作机会清单。联合德眉资策划推动一批产业链锻长补短项目、供应链安全备份项目，建立产业链缺失环节补链清单，补齐产业链、供应链空白薄弱环节，提升区域链环相扣、集群高效的产业链集成能力。\n\n## 引优育强促进产业夯基固本\n\n支持链主企业通过并购、发展总部经济等方式做大做强，对市场拓展、增资扩产等实行“一企一策”专班服务，推动更多企业挺进世界500强、中国制造业500强。围绕链主企业梯度培育链属企业、链式催生“有根”企业，建立常态化联合招商机制，完善招商信息和资源共享机制，建立“链主企业+配套企业+产业投资基金+中介机构+领军人才”资源库并动态更新，促进成都与区域上下游企业紧密合作。\n\n## 推动产业跨区域转移承接\n\n依托制造业的独特优势，积极服务国家产业链供应链安全，高质量对接东部沿海地区产业新布局，主动承接东部沿海地区制造业转移，加快共建国家区域性高技术产业和先进制造业基地，尽力推动传统产业改造提升，前瞻部署未来产业，促进数字经济与实体经济深度融合。发挥成都市工业互联网供需对接平台作用，引导非核心产业向省内区域疏解，构建形成产业链上下游联动的一体化生产与服务网络，在推动成都由“做强极化效应”向“扩大辐射效应”升级过程中，带动全省产业发展的同步跃升。\n\n## 关联概念\n\n- [成都深化区域合作的体制机制改革与总体框架](../concepts/proposition-28120de9b045.md) — ref-d6ccc11f85e0 提出推动产业跨区集聚成链发展的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘产业协同’领域。前者是后者中产业协同部分的具体政策建议，二者存在建议与框架的实质关联。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-d6ccc11f85e0` — 综合篇 › 五、成都未来深化区域合作的建议 › （一）着力推动产业跨区集聚成链发展 · 第 33 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-d6ccc11f85e0"]}, {"id": "proposition-d34e62693a0c", "title": "成都深化区域合作的科技协同创新网络构建", "type": "政策建议", "kind": "proposition", "description": "成都通过联动筑强原始创新集群、推进都市圈创新平台开放共享、构建全链贯通的成果转化体系及协同共营创新生态，协同构建高效科技协同创新网络。", "body": "## 联动筑强原始创新集群\n\n以共建西部（成都）科学城为重点，联动统筹优化战略科技力量布局。着力推进TH实验室和天府实验室建设，加快科研人员导入和科研项目实施。推动中科院成都分院机构和人员全面入驻、中科院光电所园区竣工投用、北京大学成都前沿交叉生物技术研究院等项目落地投运。\n\n## 推进都市圈创新平台开放共享\n\n加快出台重大科研基础设施和大型科研仪器开放共享实施办法，支持各类重点实验室、工程（技术）研究中心等创新平台面向成渝地区创新主体开展技术服务。推动成德、成眉协同创新中心实质运行，推进“科创通”德阳、眉山平台稳定运行。支持省内外企业利用成都超算中心、华为成都智算中心开展大数据、云计算和人工智能等领域合作，推动建立区域科学基础设施联盟。\n\n## 构建全链贯通的成果转化体系\n\n依托西部（成都）科学城建设加速聚合高水平科技服务资源，加速联接省、市、区科技市场。推动与全国性、行业性以及其他区域性技术市场的互联互通，建立线上线下相结合的一体化技术交易市场网络。加快推进先进技术成果西部转化中心建设，布局一批先进JM融合技术成果转化孵化园区。\n\n## 协同共营科技创新良好生态\n\n联动德眉资深入开展科技创新券互认互通试点，有力推动成都都市圈科技资源开放共享。完善创新人才共培共育共享机制，探索建立户口不迁关系不转、职称互认的科技人才柔性流动机制。持续举办创新资源市（州）行、成德眉资创新大赛等活动，推动成都算力服务、技术研发、科技金融、知识产权等创新服务向成渝地区辐射。健全知识产权行政执法协作机制，构建统一的知识产权“一站式”协同保护平台。\n\n## 关联概念\n\n- [成都深化区域合作的体制机制改革与总体框架](../concepts/proposition-28120de9b045.md) — ref-3f94a4b993eb 提出构建科技协同创新网络的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘创新协同’领域。前者是后者中创新协同部分的具体政策建议，二者存在建议与框架的实质关联。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-3f94a4b993eb` — 综合篇 › 五、成都未来深化区域合作的建议 › （二）协同构建高效科技协同创新网络 · 第 33–34 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-3f94a4b993eb"]}, {"id": "proposition-f103da0535eb", "title": "成都深化区域合作的基础设施互联互通水平提升", "type": "政策建议", "kind": "proposition", "description": "成都通过提升空港陆港枢纽链接力、增强跨区域交通互联互通能力及强化其他基础设施统筹建设，聚力提升基础设施互联互通水平。", "body": "## 提升空港陆港枢纽通道网络链接力\n\n大力发展国际通程中转联运航线，加快设立基地货运航空公司和航空货运转运（分拨）中心，提升航空客货运中转效率。加快建设天府高铁站、天府国际机场高铁站、天府国际机场高速公路，争取将成南达万高铁、成渝客专、成绵乐动车引入天府国际机场。\n\n加强成都国际铁路港、成都公路口岸与长江水运港口、东部沿海地区重点港口联动发展，畅通成都陆港空港与省内外重要的物流园区、大型货（场）站、物流基地之间的快速连通专线。重点贯通成都连接泸州、宜宾、乐山沿长江水港的三条专线通道，形成以成都为中心向外辐射的多式联运网络。\n\n## 增强跨区域交通互联互通能力\n\n加快推进成自宜高铁、成达万高铁、成渝中线高铁、成资S3线、成眉S5线、成德S11线、天眉乐高速等项目建设，持续实施成渝、成乐、成绵、成南、成自泸等高速扩容改造。\n\n力争西成高铁、川藏铁路引入成都枢纽线、市域铁路公交化运营改造二期工程、宝成铁路改造及新建青白江至金堂线、新峨高速等项目尽早开工建设，强化与国内主要城市的互联互通。\n\n## 强化其他基础设施统筹建设\n\n有序推进跨区域能源、水利、信息等基础设施跨区域布局建设，积极建设威远一乐山一天府新区等天然气管网，加快实施成都新津500千伏变电站配套送出工程永久方案。\n\n大力建设全国一体化算力网络成渝国家枢纽节点，统筹推动数据中心和存算资源协同布局，聚力强化各类基础设施建设运营信息共享、调度管理业务协同，合力提升基础设施建管水平。\n\n## 关联概念\n\n- [成都深化区域合作的体制机制改革与总体框架](../concepts/proposition-28120de9b045.md) — ref-ea018f9a8d09 提出提升基础设施互联互通水平的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘基础设施共建’领域。前者是后者中基础设施共建部分的具体政策建议，二者存在建议与框架的实质关联。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-ea018f9a8d09` — 综合篇 › 五、成都未来深化区域合作的建议 › （三）聚力提升基础设施互联互通水平 · 第 34 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-ea018f9a8d09"]}, {"id": "topic-357bc199d3b3", "title": "区域经济发展展望：加快建设现代化都市圈", "type": "分析框架", "kind": "topic", "description": "现代化都市圈建设将进入快速阶段，重点推动设施共联、产业共链、服务共享和生态共保，打破行政壁垒。", "body": "## 核心判断\n\n都市圈是城市集聚效应和辐射效应共同作用的体现，是城市化最有效率和效益的发展模式，在打破城市发展行政壁垒、提升资源要素配置效率、促进城镇化高质量发展中具有巨大潜能。随着国家先后批复南京、福州、成都、长株潭、西安、重庆、武汉都市圈发展规划，未来，现代化都市圈建设将进入快速阶段。\n\n## 建设重点与实施路径\n\n现代化都市圈建设将在设施共联畅通、产业共链协作、服务共享联动、生态共保提升等方面的建设进入更高层次水平。\n\n- 基础设施建设方面，重点推动中心城市基础设施向周边城市延伸布局，实现基础设施“同城同网”。\n- 产业发展方面，重点找准利益联结突破口，推动全产业链深度协作，打造重点产业生态圈和产业链。\n- 民生福祉改善方面，重点推动教育、医疗、社会保障等优质公共服务便利共享，促进都市圈群众享受更多层级、更加精细的民生服务。\n- 生态保护方面，重点联合推动生态环境修复和保护，健全完善生态补偿机制，促进生态产品价值创造性转化。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-353b788b16a3 指出生态共保是合作中的问题领域，ref-ab1ae09c6984 提出生态共保是现代化都市圈建设的重要方向和目标。前者揭示了现状差距，后者提供了未来目标和路径，二者在政策链条上构成‘问题-对策/愿景’的互补关系。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-ab1ae09c6984` — 综合篇 › 四、区域经济发展未来展望 › （三）加快建设现代化都市圈，强化新型城镇化的硬核支撑 · 第 32 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-ab1ae09c6984"]}, {"id": "topic-3dacb88e9882", "title": "成都推动区域合作面临的问题或困难", "type": "分析框架", "kind": "topic", "description": "2023年成都区域合作在产业引领、创新共享、通道枢纽、生态共保、公共服务及体制机制六个方面存在改进空间。", "body": "## 核心判断\n\n2023年，成都“引进来”“走出去”双向发力，高水平推动产业、创新、基础设施、生态环境、公共服务等领域开展深入合作，取得明显成效。区域合作是一个长期渐进的过程，新形势、新要求下，对照区域协调发展目标、对标其他先发区域，通过调研与数据分析发现，成都推动区域合作仍然存在一定改进和提升空间，必须进一步主动作为，全力提升区域合作质效。\n\n成都推动区域合作面临的问题主要集中在产业发展引领能力、创新资源要素共享、通道枢纽共建统筹、污染联防联控及生态共保共治机制、公共服务合作深入程度以及工作推进连贯性六个方面。\n\n## 产业发展引领能力需加强，错位协同发展难度仍较大\n\n一是产业引领辐射带动作用有限。与北京、上海、广州等城市相比，成都产业链条增值收益相对较低，部分重点产业链存在环节缺失，企业根植性不强，头部企业数量较少、本土企业大而不强，产业链集群效应偏弱、带动性不够。例如，2023年，成都制造业单项冠军示范企业和单项冠军产品数量仅13个，与深圳、上海、杭州、广州等城市相比差距较大；世界本土500强企业仅4家，远低于上海、深圳、杭州、广州，对周边区域产业带动能力较为有限。\n\n![原始 PDF 第 33 页图片](assets/private-asset-removed.svg)二是错位联动的产业格局尚未形成。以成渝地区双城经济圈为例，2023年，成都与各城市产业结构相似系数均大于0.873，与重庆相似系数高达0.974，与其他城市产业结构趋同会抑制整体联动效应的发挥，制约了产品和要素的合理流动，不利于发挥各自比较优势，降低区域整体经济效益。\n\n![原始 PDF 第 33 页图片](assets/private-asset-removed.svg)三是产业协作推进力度有待加大。以成都市圈园区合作为例，共建推进大多依托合作协议、合作事项等方式开展，合作较为松散，部分园区建立了合作共建领导小组，但多数园区尚未构建形成权责明晰的组织架构体系和沟通对接机制，在实际推进过程中共建难度较大。\n\n产业协同不足表现为头部企业缺失、产业结构高度趋同以及园区合作机制松散，导致区域整体经济效益受限。\n\n- 2023年成都制造业单项冠军示范企业和单项冠军产品数量仅13个\n- 成都与世界本土500强企业仅4家\n- 2023年成都与各城市产业结构相似系数均大于0.873，与重庆相似系数高达0.974\n\n## 创新资源要素共享还不足，协同创新转化链条待健全\n\n一是科技创新资源开放共享水平有待提高。科技资源开放共享有利于为区域协同创新策源提供有力支撑，实现资源利用最大化，但成都与都市圈、成渝地区双城经济圈等区域的各类创新资源共享程度还有待提升，例如，成都与重庆创新券跨区域“通用通兑”工作进展缓慢，成都超算数据中心等优质科技资源、平台与重庆企业创新合作的广度和深度依然不够，科技创新资源共享使用成效不好。二是协同创新基础有待夯实。高品质高能级科技创新平台是跨区域科技创新合作的重要载体，成都仅有4个国家级重大科技基础设施，与上海（20个）等城市相比存在一定差距；拥有12家国家重点实验室，较上海低29家，重大创新平台仍然较少、平台服务功能有待提升，不利于成都与其他区域开展科技协同创新、成果转移转化。\n\n![原始 PDF 第 35 页图片](assets/private-asset-removed.svg)\n\n![原始 PDF 第 34 页图片](assets/private-asset-removed.svg)三是创新要素高效融合有待加强。成都与其他区域人才、技术、资本等创新要素跨区域流动仍然存在壁垒，抢人才、抢资金等不良竞争依然存在。例如，从人才流入和流出成都的城市排名来看，流入流出到重庆的占比均位列第一位，重庆流入占比9.8%、流向重庆占比为7.4%，与德阳、眉山、资阳、宜宾等省内城市人才均建立了联系，但与川南、川东北等地其他城市人才联系度还有待进一步强化。\n\n![原始 PDF 第 35 页图片](assets/private-asset-removed.svg)\n\n创新资源共享不足、高能级平台缺失以及要素流动壁垒共同制约了协同创新转化链条的健全。\n\n- 成都与重庆创新券跨区域“通用通兑”工作进展缓慢\n- 成都仅有4个国家级重大科技基础设施，拥有12家国家重点实验室\n- 重庆流入成都人才占比9.8%，流向重庆占比为7.4%\n\n## 通道枢纽共建统筹不够，跨区域服务支撑还不强\n\n一是国际航空枢纽共建缺乏统筹。例如，以成渝共建世界级机场群为例，成都与重庆机场功能定位、市场定位有一定的模糊、重叠，机场分工定位不够清晰，航线网络特别是国际航线网络开发缺乏整体统筹，共同对上争取航权配额与要素保障还有较大提升空间，市场服务腹地也存在部分重合，尚未形成协同合作机制，难以支撑国际航空枢纽建设。二是多向度对外枢纽通道连接水平有待提高。目前，成都仅有3条出川高铁，西向川藏铁路全线贯通尚需时日，至京津冀、长三角、粤港澳大湾区高铁通道处于在建或前期工作阶段。三是运输服务协同发展不足。例如，成都与重庆等城市多式联运体系建设弱项突出，公水联运通道和设施建设合作有待完善，重要物流节点铁路专用线等设施建设较为薄弱。同时，成都与重庆西部陆海新通道运营主体合作不深，成渝运营主体合作尚处于起步阶段，合作目前更多停留在班列的开行组织上，在市场的深耕、产品的开发，境外资源的挖潜、服务方式的创新上有待更进一步提升与融合。\n\n通道枢纽建设面临功能定位重叠、对外连接水平有限以及运输服务协同不足的挑战。\n\n- 成都与重庆机场功能定位、市场定位有一定的模糊、重叠\n- 成都仅有3条出川高铁\n- 成都与重庆西部陆海新通道运营主体合作尚处于起步阶段\n\n## 污染联防联控及生态共保共治机制还缺乏刚性\n\n一是跨界流域联防联控合作推进不畅。由于行政区划不同，成都与其他城市跨界河流共界河段存在一定的信息不通畅、职责不清晰、监管难度大等问题，以老鹰水库为例，老鹰水库岸线长82.2公里，涉及责任主体较多，各地、各部门管控力度不一致，工作缺乏统一调度，联防联控成效有待进一步提高。二是生态环境共治缺乏刚性制度保障。生态环境共同治理大都以政策文件为主，例如，成都与德眉资生态环境同城化发展依然还缺乏一个统一的、制度性的、具体的立法协作制度，影响了跨区域生态环境共同治理成效。三是生态环境补偿合作尚未实质推进。以沱江流域为例，跨市界生态环境损害赔偿、生态产品市场交易与生态保护补偿协同推进机制仍未系统建立，尚未形成主要污染物排污权、碳排放权、水权交易等具备市场化特征的生态补偿机制。\n\n生态共保面临联防联控推进不畅、缺乏刚性制度保障以及生态补偿合作未实质推进的问题。\n\n- 老鹰水库岸线长82.2公里，涉及责任主体较多，各地、各部门管控力度不一致\n- 成都与德眉资生态环境同城化发展缺乏统一的、制度性的、具体的立法协作制度\n- 沱江流域跨市界生态环境损害赔偿、生态产品市场交易与生态保护补偿协同推进机制仍未系统建立\n\n## 公共服务合作不够深入，便捷互认及服务共享待提升\n\n一是公共服务便捷互认有待提升。例如，成都与重庆医疗住院、民航高铁、购买商业保险等方面信息共享渠道尚未打通，跨区域“无感认证”存在困难。成都“蓉易认”检查检验结果互认系统尚未推广运用到德眉资，成都与三地间医疗机构间检查检验结果互认尚未实现电子化；四地传染病监测预警一体化平台也还未建立，重点传染病监测和风险评估信息实时互通尚未实现。二是公共服务一体化发展不足。例如，成德眉资四市文旅资源开发、市场联动不足，四市间客源市场互动、游客互送、政策互惠等尚未全面实现，旅游业协同立法实践不足，文化价值、文旅品牌整体联动打造不够。三是公共服务合作质效有待提高。例如，在文旅合作方面，成都与重庆联合推出有温度、接地气、聚人气的文体旅惠民举措较少，两地市民在成渝文体旅协同发展成果方面的获得感有待提升；在教育合作方面，成都与德阳、眉山、资阳教育合作以教师培训、共享会议等形式为主，合作层次较浅，亟需进一步创新和迭代合作形式，提升跨区域教育合作效果。\n\n公共服务合作在便捷互认、一体化发展及合作质效方面均存在不足，制约了区域居民获得感。\n\n- 成都与重庆医疗住院、民航高铁、购买商业保险等方面信息共享渠道尚未打通\n- 成都“蓉易认”检查检验结果互认系统尚未推广运用到德眉资\n- 成都与德阳、眉山、资阳教育合作以教师培训、共享会议等形式为主，合作层次较浅\n\n## 工作推进缺乏连贯性，体制机制约束力不强\n\n一是区域合作工作推进机制有待健全。以成渝合作为例，虽然成都与重庆构建了“三级工作机制”，但两地相关单位沟通交流“一方热一方冷”的问题突出，工作专班两地专班组长之间，以及牵头单位与成员单位之间尚未建立合作项目定期会商、常态化信息互通共享机制，难以达到实质性推动工作的效果。二是有约束力的区域合作机制尚未建立。虽然成都与都市圈、成渝地区双城经济圈等城市通过项目合作、科技创新合作等形式扎实推进区域合作，但部分合作仍停留在签订协议、务虚协商等层面，缺乏高层次和有约束力的体制机制，区域合作缺乏具体有效的抓手，签署合作协议难以取得实质性进展。\n\n区域合作工作推进机制不健全及缺乏有约束力的体制机制，导致合作难以取得实质性进展。\n\n- 成都与重庆构建了“三级工作机制”，但两地相关单位沟通交流“一方热一方冷”\n- 工作专班两地专班组长之间，以及牵头单位与成员单位之间尚未建立合作项目定期会商、常态化信息互通共享机制\n- 部分合作仍停留在签订协议、务虚协商等层面，缺乏高层次和有约束力的体制机制\n\n## 关联概念\n\n- [区域经济发展展望：加快建设现代化都市圈](../concepts/topic-357bc199d3b3.md) — ref-353b788b16a3 指出生态共保是合作中的问题领域，ref-ab1ae09c6984 提出生态共保是现代化都市圈建设的重要方向和目标。前者揭示了现状差距，后者提供了未来目标和路径，二者在政策链条上构成‘问题-对策/愿景’的互补关系。\n- [成都区域合作挑战：产业协作配套引领能力有待提升](../concepts/topic-74995987ce14.md) — ref-0fb9dac12088 详细分析了产业协作配套引领能力不足的具体表现，ref-353b788b16a3 将产业发展引领能力需加强列为六大问题之首。前者是后者的具体证据和细节，二者存在实质性的问题-证据关系。\n- [成都区域合作挑战：公共服务跨区合作效率有待提升](../concepts/topic-9524950d410f.md) — ref-353b788b16a3 指出公共服务跨区合作效率有待提升，ref-bfdce8b8c308 详细分析了公共服务合作在广度、深度、精度上的不足。前者是后者的上位概括，后者是前者的具体证据，阅读后者能显著增加对前者中公共服务问题的理解。\n- [成都区域合作挑战：区域协同发展体制机制仍需健全](../concepts/topic-de1850bdacd3.md) — ref-1bf293ac8675 详细阐述了体制机制不健全（如缺乏顶层设计、利益共享机制缺失），ref-353b788b16a3 将体制机制列为六大问题之一。前者是后者的具体展开，阅读前者能深入理解后者中体制机制问题的实质。\n- [成都区域合作挑战：基础设施互联互通网络仍需完善](../concepts/topic-fd62a0ad7acb.md) — ref-353b788b16a3 指出基础设施互联互通存在改进空间，ref-68285617da7a 详细分析了基础设施网络不完善的具体表现（如枢纽链接力弱、断头路等）。前者是后者的上位概括，后者是前者的具体证据，存在实质互补关系。\n- [成都区域合作挑战：生态环境共保共治有待拓展深化](../concepts/topic-7b2b528214e4.md) — ref-0c35c38d7555 指出生态共保机制不完善、信息共享不足，ref-353b788b16a3 将生态共保列为区域合作六大问题之一。前者是后者的具体展开和证据，阅读前者能显著增加对后者中生态领域问题的理解。\n- [成都区域合作挑战：科技创新跨区协同共享有待加强](../concepts/topic-4484e5dfde8f.md) — ref-353b788b16a3 指出创新共享是合作中的问题领域，ref-cc9ac203a73c 详细分析了创新协同共享不足的具体表现（如平台共建不足、转化不畅）。前者是后者的上位概括，后者是前者的具体证据，存在实质性的问题-证据关系。\n\n## 溯源\n\n- [Article：cc74e3e3-a764-4bab-b326-3b64fe6ad5eb](../articles/article-e25747f62171.md)\n\n## ConceptRef\n\n- `ref-353b788b16a3` — 综合篇 › 三、成都推动区域合作面临的问题或困难 · 第 32–36 页", "articles": ["article-e25747f62171"], "ref_ids": ["ref-353b788b16a3"]}, {"id": "topic-4484e5dfde8f", "title": "成都区域合作挑战：科技创新跨区协同共享有待加强", "type": "分析框架", "kind": "topic", "description": "成都创新载体平台共建共享不足，跨区域成果转化通道不畅且利益分享机制不健全，创新协同支撑机制如科技金融、知识产权保护等仍待完善。", "body": "## 核心判断\n\n成都科技创新跨区协同共享面临三大主要挑战：创新载体平台共建共享不足、创新成果跨区域转化不畅以及创新协同支撑机制仍待完善。尽管成都已聚集众多科技活动机构和高能级创新平台，但受限于信息资源联动缺失、共享制度不健全及跨区域合作机制缺位，创新要素的跨区域流动与高效配置受到显著制约。\n\n## 证据与影响\n\n在平台共享方面，成都与其他城市的科技项目库、成果库、专家库等信息资源及科学数据、科技文献、知识产权等尚未实现联动共享，且重点实验室、大型研发设备及科技服务平台的共享制度不健全，导致平台开放共享动力不足。在成果转化方面，由于缺乏规范统一的技术交易机制，各级市场未互联互通，导致成果转化通道不畅，利益分享机制不健全。例如，成都创新成果在德眉资地区的转化能力较弱，跨市联合申报专利数占专利总数比值约为2.3%，仅为深圳都市圈的40%，优势技术难以有效转化为优势产业。在支撑机制方面，科技金融服务平台共享机制、跨区域知识产权保护及信息互通有待加强，缺乏跨区域、高能级、行业级的中试熟化平台。此外，人才跨区域招引和流动不足，政策协同不够，关键共性技术联合攻关机制尚未建立，“揭榜挂帅”“赛马制”等协同攻关模式未有效开展。\n\n- 创新资源未联动：科技项目库、成果库、专家库及科学数据、知识产权等信息资源未与其他城市实现联动共享。\n- 共享制度不健全：重点实验室、大型研发设备及科技服务平台缺乏健全的共享制度，导致开放共享意愿低。\n- 转化通道不畅：缺乏规范统一的技术交易机制，市场未互联互通，跨区域利益分享机制不健全。\n- 转化效率偏低：成都创新成果在德眉资转化不足，跨市联合申报专利占比约2.3%，约为深圳都市圈的40%。\n- 支撑机制缺失：缺乏跨区域、高能级、行业级的中试熟化平台，科技金融共享及知识产权保护机制待完善。\n- 协同攻关不足：人才跨区域流动不足，关键共性技术联合攻关机制未建立，“揭榜挂帅”“赛马制”未有效开展。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-353b788b16a3 指出创新共享是合作中的问题领域，ref-cc9ac203a73c 详细分析了创新协同共享不足的具体表现（如平台共建不足、转化不畅）。前者是后者的上位概括，后者是前者的具体证据，存在实质性的问题-证据关系。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-cc9ac203a73c` — 综合篇 › 三、成都推动区域合作面临的挑战与问题 › （二）科技创新跨区协同共享有待加强 · 第 28–29 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-cc9ac203a73c"]}, {"id": "topic-65250e9c4020", "title": "区域经济发展展望：深入实施区域重大战略", "type": "分析框架", "kind": "topic", "description": "通过持续实施京津冀、长三角、粤港澳、黄河流域及成渝地区双城经济圈等重大战略，打造高质量发展引擎和动力源。", "body": "## 核心判断\n\n当前，京津冀、长三角、粤港澳大湾区等区域在规模经济效益、创新要素集聚、人才高地建设及对外开放开发等方面均走在前列，已成为我国高质量发展的强大引擎。未来将持续深入实施区域重大战略，以壮大引领周边发展的动力源。\n\n## 战略实施路径\n\n京津冀发展着重疏解北京非首都功能，进一步提高区域基础设施、产业布局、生态环境、公共服务的联动水平，发挥北方经济发展引擎作用。长江经济带着重修复长江生态环境，建设以绿色为重要特征的现代化产业体系，成为经济高质量发展的主力军。\n\n- 长三角地区推动科创与产业深度融合，持续深化长三角生态绿色一体化发展示范区等改革创新，打造全国发展强劲活跃增长极。\n- 粤港澳大湾区加快建设横琴、前海、南沙、河套等重大合作平台，打造新发展格局的战略支点、高质量发展的示范基地、中国式现代化的引领地，辐射带动泛珠三角区域发展。\n- 黄河流域加强生态保护治理，促进制造业高质量发展和资源产业转型，打造成为我国生态安全的重要屏障区、能源安全保障区和高质量发展的试验区。\n- 成渝地区双城经济圈强化功能协同链接、提升交通互联互通水平、构建跨区域产业生态圈、打造协同创新共同体、共建高品质生活宜居地，打造区域新的增长极和动力源。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-598f0d48bfa6` — 综合篇 › 四、区域经济发展未来展望 › （二）深入实施区域重大战略，壮大引领周边发展的动力源 · 第 31 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-598f0d48bfa6"]}, {"id": "topic-74995987ce14", "title": "成都区域合作挑战：产业协作配套引领能力有待提升", "type": "分析框架", "kind": "topic", "description": "成都跨区域产业集群竞争力不强，制造业处于产业链中低端，缺乏核心环节和定价权，且跨区域产业合作尚未形成链式配套格局。", "body": "## 核心判断\n\n成都跨区域产业协作配套引领能力不足，主要表现为跨市域产业集群竞争力不强、制造业引领带动能力较弱，以及跨区域产业合作尚未形成链式配套格局。\n\n成都制造业长期以承接产业转移为主，多处于组装、加工环节，缺乏高附加值的核心关键环节和有定价权的企业产品，与省内城市及重庆部分产业环节缺乏分工，导致整体引领带动省内区域协同发展的能力较弱。\n\n## 证据与影响\n\n截至2022年，成都跨区域的国家级产业集群仅有2个，明显落后于广州的3个，且共建的汽车、轨道交通、通用航空和生物医药产业集群建设离国家先进水平还有一定差距。\n\n对标苏锡常都市圈，苏州、常州、无锡已形成链式配套，而成都与省内外城市产业合作多为企业间的“点点协作”，“总部+基地”“终端产品+协作配套”合作模式发展不及预期，成链成群、协作互补、差异化发展的产业发展格局尚未全面形成。\n\n- 跨市域产业集群竞争力不强：国家级跨区域集群仅2个，落后于广州，共建集群距国家先进水平有差距。\n- 制造业引领带动能力弱：处于产业链中低端，缺乏核心环节和定价权，与周边城市分工不足。\n- 跨区域合作未“串点成链”：多为“点点协作”，缺乏苏锡常式的链式配套和差异化发展格局。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-0fb9dac12088 详细分析了产业协作配套引领能力不足的具体表现，ref-353b788b16a3 将产业发展引领能力需加强列为六大问题之首。前者是后者的具体证据和细节，二者存在实质性的问题-证据关系。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-0fb9dac12088` — 综合篇 › 三、成都推动区域合作面临的挑战与问题 › （一）产业协作配套引领能力有待提升 · 第 28 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-0fb9dac12088"]}, {"id": "topic-7b2b528214e4", "title": "成都区域合作挑战：生态环境共保共治有待拓展深化", "type": "分析框架", "kind": "topic", "description": "成都跨区域生态合作领域局限，共保机制不完善且执法约束力不强，信息共享机制仍不健全。", "body": "## 核心判断\n\n成都与外地在生态环境共保共治方面面临拓展深化的挑战，主要体现在合作领域局限、跨区域机制不完善以及信息共享机制不健全三个方面。\n\n## 合作领域与机制现状\n\n生态保护治理合作较为局限，目前成都与德眉资开展合作较为频繁，而与其他城市的合作主要集中于大气及水污染治理领域，在绿色低碳发展、跨区域绿色廊道打造、生态保护区建设等方面的合作较少。跨区域生态共保机制仍需完善，成都与成都平原经济区其他城市的会商与协调联动工作机制还不完善，协同监管仍停留在文件制定及沟通交流层面，实质性进展缓慢。\n\n环境保护治理交叉执法力度不够，成都与其他城市生态环境执法范围仅限定于各自行政区划范围内，特别是跨界毗邻地区生态环境污染治理约束力不强。\n\n## 信息共享机制障碍\n\n生态环境信息共享机制仍需健全，虽然成都与德眉资搭建了河长制E平台、空气质量预测预报中心，与重庆搭建了“环保管家”平台，但由于缺乏有效的政策保障措施，区域生态环境信息互通共享仍较不足。\n\n- 生态环境监测数据、生态系统数据、固定污染源及移动污染源排污信息、气象及水文等领域的数据共享仍存在一定困难。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-0c35c38d7555 指出生态共保机制不完善、信息共享不足，ref-353b788b16a3 将生态共保列为区域合作六大问题之一。前者是后者的具体展开和证据，阅读前者能显著增加对后者中生态领域问题的理解。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-0c35c38d7555` — 综合篇 › 三、成都推动区域合作面临的挑战与问题 › （四）生态环境共保共治有待拓展深化 · 第 29 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-0c35c38d7555"]}, {"id": "topic-9524950d410f", "title": "成都区域合作挑战：公共服务跨区合作效率有待提升", "type": "分析框架", "kind": "topic", "description": "成都跨区域公共服务合作在广度、深度和精度方面均存在不足，表现为合作范围局限、政策标准不统一及数据共享不充分。", "body": "## 核心判断\n\n成都跨区域公共服务合作效率面临广度、深度和精度三重挑战。在广度上，合作主要集中在川渝、长三角、粤港澳及部分西部地区，与中部、东北地区及北京、上海等城市的养老、就业、政务、文体等领域合作较少。在深度上，与其他地区的公共服务政策和标准尚不统一，缺乏有效的互认互通机制。在精度上，数据共享不充分，政务服务平台尚未实现互联互通，制约了公共服务的精准供给。\n\n## 证据与影响\n\n具体而言，人才合作领域存在壁垒，成都与其他区域在人才落户、居住、就医、子女入学等标准和政策不统一，导致人才资源协同困难。同时，成都与省外多个地方政务平台在准入标准互认、业务系统互联、数据资源共享等方面存在诸多限制。户籍、教育、就业、医疗等公民基本信息在不同区域之间仍处于分散割据状态，直接影响了公共服务供给的精准性。\n\n- 合作范围局限：主要集中于川渝、长三角、粤港澳及部分西部地区，缺乏与中部、东北地区的合作，与京沪等城市在养老、就业等领域合作较少。\n- 政策标准不统一：人才落户、居住、就医、子女入学等标准不统一，缺乏互认互通机制，形成人才资源协同壁垒。\n- 数据共享不充分：政务服务平台未互联互通，准入标准、业务系统、数据资源共享受限，公民基本信息分散割据，制约精准供给。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-353b788b16a3 指出公共服务跨区合作效率有待提升，ref-bfdce8b8c308 详细分析了公共服务合作在广度、深度、精度上的不足。前者是后者的上位概括，后者是前者的具体证据，阅读后者能显著增加对前者中公共服务问题的理解。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-bfdce8b8c308` — 综合篇 › 三、成都推动区域合作面临的挑战与问题 › （四）生态环境共保共治有待拓展深化 › （五）公共服务跨区合作效率有待提升 · 第 30 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-bfdce8b8c308"]}, {"id": "topic-bf0586096c83", "title": "区域经济发展展望：统筹推进四大板块发展", "type": "分析框架", "kind": "topic", "description": "未来将继续坚持西部大开发、东北振兴、中部崛起和东部率先发展战略，缩小区域间绝对差距，提升协调发展水平。", "body": "## 核心判断\n\n当前，虽中西部地区经济增速总体快于东部地区，但是区域间绝对差距仍然较大。因此，未来，我国仍将继续坚持西部大开发、东北振兴、中部崛起和东部率先发展的区域发展总体战略，大力提升区域间协调发展水平。\n\n## 四大板块具体路径\n\n具体而言，加快推动西部大开发形成新格局，研究修订《西部地区鼓励类产业目录》，推动承接国内外产业转移，鼓励西北地区与西南地区合作互动，加快建设西部陆海新通道；加快推动东北全面振兴取得新突破，研究完善政策举措，着力优化营商环境，推进哈长沈大科技创新走廊建设，加快传统优势产业转型升级和新兴产业培育，增强重点城市人口和经济活动承载能力；积极促进中部地区加快崛起，鼓励长江中游三省协同协作，大力推动粮食生产、能源原材料、现代装备制造及高技术产业基地和综合交通运输枢纽建设；东部地区要加快推进现代化，发挥创新要素集聚等优势，不断提高创新策源能力和全球资源配置能力，探索高质量发展先行之路。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-586ff7cdf04b` — 综合篇 › 四、区域经济发展未来展望 › （一）统筹推进四大板块发展，增强区域发展平衡性协调性 · 第 31 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-586ff7cdf04b"]}, {"id": "topic-dafc9a7fc968", "title": "区域经济发展展望：健全区域协调发展机制", "type": "分析框架", "kind": "topic", "description": "未来将重点建立区域合作利益分享、协调发展激励、横向生态补偿及全国统一大市场等机制，促进要素高效配置。", "body": "## 核心判断\n\n推动区域一体化发展，必然要建立健全区域资源共享、共融、共赢的体制机制。随着我国区域协调发展决策部署和政策体系的不断完善，区域协调发展体制机制不断健全，但在区域合作和一体化推进过程中，仍然面临着一些基础性、市场性、利益联结性障碍。因此，未来应以区域合作体制机制的薄弱环节为切入点，构建完善区域协调发展体制机制。\n\n## 重点机制与实施路径\n\n重点将研究建立区域合作利益分享机制，鼓励区域间共建产业园区，形成巨大优势互补合力；着力构建协调发展激励机制，加大转移支付力度，确保基本公共服务均等化；加快建立横向利益补偿机制，推动出台生态保护补偿条例，鼓励生态保护地和受益地、流域上下游合作发展，开展市场化、多元化生态补偿。\n\n- 加快建立全国统一大市场，进一步优化产权保护、市场准入、公平竞争、社会信用等市场经济基础性制度。\n- 促进各类生产要素有序流动、高效集聚、优化配置，增强区域发展活力。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-12fd8c6ed81d` — 综合篇 › 四、区域经济发展未来展望 › （四）健全区域协调发展机制，促进生产要素合理高效配置 · 第 32 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-12fd8c6ed81d"]}, {"id": "topic-de1850bdacd3", "title": "成都区域协同发展体制机制的三大结构性挑战", "type": "分析框架", "kind": "topic", "description": "成都区域合作面临统筹力度不足、成本共担利益共享机制缺失及政策协同机制缺位三大挑战，制约实质性合作与一体化发展。", "body": "## 统筹力度不足与联动机制不完善\n\n成都与其他地区的区域合作缺乏系统性顶层设计和整体性统筹安排，合作内容、形式、政策及考核体系尚不健全。跨区域合作中涉及国家及省级层面权限的事项，亟需上位统筹支持。\n\n成都与省内其他城市的整体合作系统性不强，合作项目推进缓慢；与重庆的联动工作运行机制尚不完善，导致两地合作多停留在浅层次，实质性合作较少。\n\n## 成本共担与利益共享机制缺失\n\n成都与省内外城市尚未建立重大合作项目经济指标的单独核算体系，对重大合作项目的产值、税收等经济指标缺乏统一的统计管理机制。\n\n效益指标分成机制不够明晰，合作双方在产业协作配套、园区共同建设、协同招商引资等方面的利益分配机制多停留在协议或文件层面，尚未制定具体的分配实施办法。\n\n## 政策协同机制受限\n\n受地域及行政区划限制，成都与国内其他城市在政策环境和行政措施方面存在差异。目前合作缺少有效推动区域资源互补、分工协作及市场一体的政策措施，难以实现有效的协同联动发展。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-1bf293ac8675 详细阐述了体制机制不健全（如缺乏顶层设计、利益共享机制缺失），ref-353b788b16a3 将体制机制列为六大问题之一。前者是后者的具体展开，阅读前者能深入理解后者中体制机制问题的实质。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-1bf293ac8675` — 综合篇 › 三、成都推动区域合作面临的挑战与问题 › （六）区域协同发展体制机制仍需健全 · 第 30 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-1bf293ac8675"]}, {"id": "topic-fd62a0ad7acb", "title": "成都区域合作挑战：基础设施互联互通网络仍需完善", "type": "分析框架", "kind": "topic", "description": "成都枢纽通道跨区域链接力弱，交通设施网络化水平低且存在断头路，信息、能源等其他设施共建亟需加快。", "body": "## 枢纽通道跨区域链接力有待提升\n\n成都国际航线网络干支衔接水平不高，航空跨区域、跨洲际中转能力相对较弱，不足以支撑四川乃至西部地区国际中转和分销需求。陆港空港“港港联动”体系还未形成，尤其是高新西区、经开区等成都主要制造基地及省内重要城市与两大机场、国际铁路港之间通达性不足，难以有效将物流承载优势和要素集散能力连接成网、串点成势。\n\n## 交通设施网络化水平相对较低\n\n成都至京津冀、长三角、粤港澳大湾区高铁通道多处于在建或前期工作阶段，出川高铁通道较少。成眉S5线、成德S11线等成都都市圈市域铁路项目尚未建成通车，加之成都市域轨道交通站点多集中于中心城区及城市新区，对周边城市延伸不足。成都高速公路扩容改造步伐亟需加快，与周边城市“断头路”项目建设仍需加快攻坚。\n\n## 信息等其他设施共建亟需加快\n\n国家级互联网骨干直连点、国际直达数据专用通道等仍需扩容，信息基础设施联动支撑有待夯实。能源、电力等基础设施协同布局建设仍需加快推进。\n\n## 关联概念\n\n- [成都推动区域合作面临的问题或困难](../concepts/topic-3dacb88e9882.md) — ref-353b788b16a3 指出基础设施互联互通存在改进空间，ref-68285617da7a 详细分析了基础设施网络不完善的具体表现（如枢纽链接力弱、断头路等）。前者是后者的上位概括，后者是前者的具体证据，存在实质互补关系。\n\n## 溯源\n\n- [Article：102a4976-6f08-42bc-b866-6b9f7b53cc31](../articles/article-60b51caef447.md)\n\n## ConceptRef\n\n- `ref-68285617da7a` — 综合篇 › 三、成都推动区域合作面临的挑战与问题 › （三）基础设施互联互通网络仍需完善 · 第 29 页", "articles": ["article-60b51caef447"], "ref_ids": ["ref-68285617da7a"]}], "semantic_edges": [{"source": "proposition-0d477146b818", "target": "proposition-28120de9b045", "source_refs": [["ref-5803c244c3da", "ref-ca45f9f7d618"]], "reasons": ["ref-5803c244c3da 提出凝聚生态环境保护治理合力的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘生态共建共保’领域。前者是后者中生态共建部分的具体政策建议，二者存在建议与框架的实质关联。"]}, {"source": "proposition-28120de9b045", "target": "proposition-7050d4051104", "source_refs": [["ref-ca45f9f7d618", "ref-fb0b1430d65a"]], "reasons": ["ref-fb0b1430d65a 提出推动优质公共服务跨区延伸共享的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘公共服务共享’领域。前者是后者中公共服务共享部分的具体政策建议，二者存在建议与框架的实质关联。"]}, {"source": "proposition-28120de9b045", "target": "proposition-8f8b98a61143", "source_refs": [["ref-ca45f9f7d618", "ref-d6ccc11f85e0"]], "reasons": ["ref-d6ccc11f85e0 提出推动产业跨区集聚成链发展的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘产业协同’领域。前者是后者中产业协同部分的具体政策建议，二者存在建议与框架的实质关联。"]}, {"source": "proposition-28120de9b045", "target": "proposition-d34e62693a0c", "source_refs": [["ref-3f94a4b993eb", "ref-ca45f9f7d618"]], "reasons": ["ref-3f94a4b993eb 提出构建科技协同创新网络的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘创新协同’领域。前者是后者中创新协同部分的具体政策建议，二者存在建议与框架的实质关联。"]}, {"source": "proposition-28120de9b045", "target": "proposition-f103da0535eb", "source_refs": [["ref-ca45f9f7d618", "ref-ea018f9a8d09"]], "reasons": ["ref-ea018f9a8d09 提出提升基础设施互联互通水平的建议，ref-ca45f9f7d618 是深化区域合作的总体建议框架，其中明确包含‘基础设施共建’领域。前者是后者中基础设施共建部分的具体政策建议，二者存在建议与框架的实质关联。"]}, {"source": "topic-357bc199d3b3", "target": "topic-3dacb88e9882", "source_refs": [["ref-353b788b16a3", "ref- function drawSphereGuide(){const cx=w/2,cy=h/2,R=Math.min(w,h)*.39*sphereZoom,g=ctx.createRadialGradient(cx-R*.2,cy-R*.25,R*.08,cx,cy,R);g.addColorStop(0,"rgba(255,255,255,.78)");g.addColorStop(.72,"rgba(213,232,247,.22)");g.addColorStop(1,"rgba(20,91,159,.08)");ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="rgba(20,91,159,.18)";ctx.lineWidth=1.3;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(-pitch*.7);for(const ratio of[.35,.65,.9]){ctx.beginPath();ctx.ellipse(0,0,R*ratio,R*ratio*.22,0,0,Math.PI*2);ctx.strokeStyle="rgba(20,91,159,.07)";ctx.lineWidth=1;ctx.stroke()}ctx.restore()}
function drawSphere(){drawSphereGuide();for(const e of DATA.semantic_edges){const a=nodeById[e.source],b=nodeById[e.target];if(!enabled.has(a.type)||!enabled.has(b.type))continue;const active=selected&&(selected.id===a.id||selected.id===b.id);sphereCurve(a,b,active)}const projected=nodes.filter(n=>enabled.has(n.type)).map(n=>{const p=spherePoint(n);n.px=p.x;n.py=p.y;n.pz=p.z;n.pr=(n.ref_ids.length>1?5.5:2.6)*p.scale;return n}).sort((a,b)=>a.pz-b.pz);for(const n of projected){const active=selected&&selected.id===n.id,neighbor=selected&&DATA.semantic_edges.some(e=>(e.source===selected.id&&e.target===n.id)||(e.target===selected.id&&e.source===n.id)),match=matches(n),depth=(n.pz+1)/2,dim=selected&&!active&&!neighbor;ctx.globalAlpha=dim?.1:query&&!match?.07:.2+depth*.8;ctx.shadowColor=rgba(COLORS[n.type],.28+depth*.18);ctx.shadowBlur=n.ref_ids.length>1?10:depth*5;ctx.beginPath();ctx.arc(n.px,n.py,Math.max(1.8,n.pr),0,Math.PI*2);ctx.fillStyle=COLORS[n.type];ctx.fill();ctx.shadowBlur=0;if(n.ref_ids.length>1){ctx.beginPath();ctx.arc(n.px,n.py,n.pr+3.2,0,Math.PI*2);ctx.strokeStyle=active?"#ba3d3d":`rgba(20,91,159,${.25+depth*.45})`;ctx.lineWidth=active?2:1;ctx.stroke()}if(active){ctx.beginPath();ctx.arc(n.px,n.py,n.pr+7,0,Math.PI*2);ctx.strokeStyle="#b8892e";ctx.lineWidth=2;ctx.stroke()}if(active||hovered===n||query&&match){ctx.globalAlpha=1;ctx.font=active?"500 13px system-ui":"12px system-ui";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillStyle="#173858";ctx.fillText(n.title.slice(0,16),n.px,n.py-n.pr-8)}ctx.globalAlpha=1}if(selected&&enabled.has(selected.type))drawProvenance(selected,{x:selected.px,y:selected.py},{x:w/2,y:h/2})}
function drawProvenance(c,anchor,center){const refs=c.ref_ids.map(id=>byRef[id]).filter(Boolean),articleIds=[...new Set(c.articles)],vx=center.x-anchor.x,vy=center.y-anchor.y,len=Math.max(1,Math.hypot(vx,vy)),ux=vx/len,uy=vy/len,tx=-uy,ty=ux,refPos={},articlePos={};refs.forEach((r,i)=>{const spread=(i-(refs.length-1)/2)*18;refPos[r.ref_id]={x:anchor.x+ux*72+tx*spread,y:anchor.y+uy*72+ty*spread}});articleIds.forEach((id,i)=>{const spread=(i-(articleIds.length-1)/2)*24;articlePos[id]={x:anchor.x+ux*145+tx*spread,y:anchor.y+uy*145+ty*spread}});for(const r of refs){const p=refPos[r.ref_id],a=articlePos[r.article_id];ctx.beginPath();ctx.setLineDash([4,4]);ctx.moveTo(anchor.x,anchor.y);ctx.quadraticCurveTo((anchor.x+p.x)/2+tx*6,(anchor.y+p.y)/2+ty*6,p.x,p.y);ctx.strokeStyle="rgba(32,132,113,.72)";ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo((p.x+a.x)/2-tx*6,(p.y+a.y)/2-ty*6,a.x,a.y);ctx.strokeStyle="rgba(184,137,46,.72)";ctx.stroke();ctx.setLineDash([])}for(const r of refs){const p=refPos[r.ref_id];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);ctx.fillStyle="#208471";ctx.fillRect(-4,-4,8,8);ctx.restore()}for(const id of articleIds){const p=articlePos[id];ctx.fillStyle="#b8892e";ctx.fillRect(p.x-6,p.y-5,12,10);ctx.fillStyle="#173858";ctx.font="11px system-ui";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(id,p.x,p.y+8)}}
function renderCatalog(){const visible=nodes.filter(n=>enabled.has(n.type)&&matches(n)).sort((a,b)=>b.articles.length-a.articles.length||b.ref_ids.length-a.ref_ids.length||a.title.localeCompare(b.title)),joint=visible.filter(n=>n.ref_ids.length>1),single=visible.filter(n=>n.ref_ids.length===1);catalog.innerHTML="";const head=document.createElement("header");head.className="catalog-head";const kicker=document.createElement("div");kicker.className="catalog-kicker";kicker.textContent="ALL CONCEPT CATALOG";const title=document.createElement("h2");title.textContent="全部概念查阅";const intro=document.createElement("p");intro.textContent=`${visible.length} 个 Concept，其中 ${joint.length} 个跨文档联合概念；选择条目查看 Concept → ConceptRef → Article 完整溯源。`;head.append(kicker,title,intro);catalog.append(head);if(!visible.length){const empty=document.createElement("div");empty.className="catalog-empty";empty.textContent="当前筛选条件下没有概念。";catalog.append(empty);return}appendGroup("跨文档联合概念",joint,"由多篇 Article 的 ConceptRef 联合编译");appendGroup("单文档概念",single,"由单篇 Article 的 ConceptRef 编译");function appendGroup(label,list,hint){if(!list.length)return;const section=document.createElement("section");section.className="catalog-section";const sectionHead=document.createElement("header");sectionHead.className="catalog-section-head";const h=document.createElement("h3");h.textContent=`${label} · ${list.length}`;const note=document.createElement("span");note.textContent=hint;sectionHead.append(h,note);const grid=document.createElement("div");grid.className="catalog-grid";for(const n of list){const card=document.createElement("button");card.type="button";card.className="catalog-card"+(selected&&selected.id===n.id?" selected":"");card.setAttribute("aria-label",`${n.title}，${n.articles.length} 篇来源文章，${n.ref_ids.length} 个 ConceptRef`);const dot=document.createElement("i");dot.className="catalog-dot";dot.style.background=COLORS[n.type];const cardTitle=document.createElement("span");cardTitle.className="catalog-card-title";cardTitle.textContent=n.title;const meta=document.createElement("span");meta.className="catalog-card-meta";meta.textContent=`${n.type} · ${n.articles.length} 篇 Article · ${n.ref_ids.length} 个 Ref`;card.append(dot,cardTitle,meta);card.onclick=()=>selectNode(n);grid.append(card)}section.append(sectionHead,grid);catalog.append(section)}}
function draw(){const catalogMode=viewMode==="catalog";canvas.style.display=catalogMode?"none":"block";catalog.classList.toggle("show",catalogMode);tooltip.style.display="none";const matchesCount=query?nodes.filter(n=>enabled.has(n.type)&&matches(n)).length:0;if(catalogMode){const visibleCount=nodes.filter(n=>enabled.has(n.type)&&matches(n)).length;renderCatalog();modeBadge.textContent=query?`检索命中 ${visibleCount}`:"全部概念查阅";status.textContent=`显示 ${visibleCount} 个 Concept · 点击查看完整溯源`;summary.innerHTML=`<b>全部概念查阅</b>清单收录 ${DATA.stats.concepts} 个 Concept，其中 ${DATA.stats.multi_source} 个为跨文档联合概念；选择条目后可查阅正文、Ref 证据与来源 Article。`;return}ctx.clearRect(0,0,w,h);if(viewMode==="relations")drawWeave();else drawSphere();modeBadge.textContent=query?`检索命中 ${matchesCount}`:viewMode==="relations"?"三维关系编织网":"三维知识球";status.textContent=viewMode==="relations"?`显示 ${[...relationIds].filter(id=>relationVisible(nodeById[id])).length} 个关联 Concept · ${relationArticles.length} 篇来源 Article · 拖动旋转 · 滚轮缩放`:`显示 ${nodes.filter(n=>enabled.has(n.type)).length} 个 Concept · 拖动旋转 · 滚轮缩放`;summary.innerHTML=viewMode==="relations"?`<b>三维关系编织网</b>Concept 均匀分布在外层，来源 Article 位于内层；蓝线表示语义关系，金线表示真实来源，旋转可观察交叉深度。`:`<b>三维知识球</b>${DATA.stats.multi_source} 个多来源 Concept 位于内核，其余 Concept 均匀充盈整个球面；默认仅显示已确认的语义关系。`}
function pick(x,y){const list=nodes.filter(n=>viewMode==="relations"?relationVisible(n):enabled.has(n.type)).map(n=>({n,p:{x:n.px,y:n.py},z:n.pz})).sort((a,b)=>b.z-a.z);for(const item of list){const radius=viewMode==="relations"?Math.max(10,item.n.pr+6):Math.max(8,item.n.pr+5);if(Math.hypot(item.p.x-x,item.p.y-y)<=radius)return item.n}return null}

function renderDetail(c){const refs=c.ref_ids.map(id=>byRef[id]).filter(Boolean),relations=DATA.semantic_edges.filter(e=>e.source===c.id||e.target===c.id);detail.innerHTML="";const h=document.createElement("h2");h.textContent=c.title;detail.append(h);const meta=document.createElement("div");meta.className="meta";for(const text of[c.type,c.ref_ids.length>1?`${c.articles.length} 篇联合编译`:"单来源",`${refs.length} 个 Ref`,`${relations.length} 组关系`]){const s=document.createElement("span");s.className="pill";s.textContent=text;meta.append(s)}detail.append(meta);const desc=document.createElement("div");desc.className="description";desc.textContent=c.description;detail.append(desc);appendTitle("Concept 正文");const body=document.createElement("div");body.className="body";body.textContent=c.body;detail.append(body);if(relations.length){appendTitle("关联 Concept");for(const e of relations){const other=byConcept[e.source===c.id?e.target:e.source],row=document.createElement("div");row.className="related";const b=document.createElement("b");b.textContent=other.title;const count=document.createElement("span");count.className="edge-count";count.textContent=`${e.source_refs.length} 条 Ref 依据`;b.append(count);row.append(b);const sm=document.createElement("small");sm.textContent=e.reasons.join("；");row.append(sm);row.onclick=()=>selectNode(nodeById[other.id]);detail.append(row)}}appendTitle("ConceptRef 证据");for(const r of refs){const box=document.createElement("div");box.className="ref";const b=document.createElement("b");b.textContent=r.title;box.append(b);const sm=document.createElement("small"),path=(r.section_path||[]).join(" › "),pages=r.page_start?(r.page_end&&r.page_end!==r.page_start?`第 ${r.page_start}–${r.page_end} 页`:`第 ${r.page_start} 页`):"";sm.textContent=[r.ref_id,path,pages].filter(Boolean).join(" · ");box.append(sm);if(r.evidence?.length){const q=document.createElement("div");q.className="quote";q.textContent=r.evidence[0];box.append(q)}detail.append(box)}appendTitle("来源 Article");for(const id of c.articles){const a=byArticle[id],row=document.createElement("div");row.className="article";const code=document.createElement("span");code.className="article-id";code.textContent=id;const title=document.createElement("span");title.textContent=a?.title||id;row.append(code,title);detail.append(row)}function appendTitle(text){const x=document.createElement("h3");x.textContent=text;detail.append(x)}}

canvas.addEventListener("mousedown",e=>{drag=true;moved=false;last=[e.clientX,e.clientY];canvas.classList.add("dragging");tooltip.style.display="none"});window.addEventListener("mouseup",()=>{drag=false;last=null;canvas.classList.remove("dragging")});window.addEventListener("mousemove",e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(drag){const dx=e.clientX-last[0],dy=e.clientY-last[1];if(Math.abs(dx)+Math.abs(dy)>3)moved=true;yaw+=dx*.008;pitch=Math.max(-1.15,Math.min(1.15,pitch+dy*.006));last=[e.clientX,e.clientY];draw();return}const next=pick(x,y);if(next!==hovered){hovered=next;canvas.style.cursor=next?"pointer":"grab";draw()}showTooltip(next,x,y)});canvas.addEventListener("mouseleave",()=>{hovered=null;tooltip.style.display="none";draw()});canvas.addEventListener("wheel",e=>{e.preventDefault();sphereZoom=Math.max(.55,Math.min(1.55,sphereZoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});canvas.addEventListener("click",e=>{if(moved)return;const r=canvas.getBoundingClientRect(),n=pick(e.clientX-r.left,e.clientY-r.top);if(n)selectNode(n)});
const types=document.getElementById("types");for(const[type,count]of Object.entries(DATA.stats.types)){const row=document.createElement("label");row.className="type-row";row.innerHTML=`<input type="checkbox" checked><span><i class="swatch" style="background:${COLORS[type]}"></i>${type}</span><small>${count}</small>`;const input=row.querySelector("input");input.onchange=()=>{input.checked?enabled.add(type):enabled.delete(type);draw()};types.append(row)}
