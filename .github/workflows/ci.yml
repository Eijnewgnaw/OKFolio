name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock pytest pytest-httpx
      - run: PYTHONPATH=. python -m pytest -q
      - run: PYTHONPATH=. python scripts/audit_open_source.py
