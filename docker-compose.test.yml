services:
  compiler:
    depends_on:
      fake-llm:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://fake-llm:8080/v1
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: test-model
    volumes:
      - ${TEST_DATA_DIR:-./runtime/test-data}:/app/runtime/data

  agentwiki:
    depends_on:
      fake-llm:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://fake-llm:8080/v1
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: test-model
    volumes:
      - ${TEST_DATA_DIR:-./runtime/test-data}:/app/runtime/data

  fake-llm:
    image: python:3.12-slim
    command: ["python3", "/server.py"]
    volumes:
      - ./tests/fake_llm.py:/server.py:ro
      - ${TEST_DATA_DIR:-./runtime/test-data}:/state
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 1s
      timeout: 1s
      retries: 20
